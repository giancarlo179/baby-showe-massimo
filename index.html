<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Baby Shower · Massimo Gonzalo</title>

  <link rel="stylesheet" href="/css/styles.css">

  <!-- QR -->
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
</head>

<body data-theme="dark">

<header class="header">
  <div class="nav">
    <div class="brand">👶 Massimo Gonzalo</div>

    <button id="menuBtn" class="hamburger">☰</button>

    <nav id="menu">
      <a href="#rsvp">RSVP</a>
      <a href="#lugar">Lugar</a>
      <a href="#regalos">Regalos</a>
    </nav>

    <div class="actions">
      <button id="themeBtn">🌙</button>
      <button id="printBtn">🖨️</button>
    </div>
  </div>
</header>

<main>

<section class="hero">
  <h1>¡Se viene el evento de Massimo Gonzalo!</h1>

  <!-- ✅ COUNTDOWN PRIMERO -->
  <div id="countdown" class="countdown">
    <div><b id="dd">00</b><span>Días</span></div>
    <div><b id="hh">00</b><span>Horas</span></div>
    <div><b id="mm">00</b><span>Min</span></div>
    <div><b id="ss">00</b><span>Seg</span></div>
  </div>
</section>

<section id="rsvp">
  <h2>Confirmar asistencia</h2>

  <form id="rsvpForm" action="https://formspree.io/f/xojkpyknd" method="POST">
    <input type="text" name="_gotcha" style="display:none">

    <input type="hidden" name="team" id="teamHidden">

    <label>
      Nombre
      <input name="name" required>
    </label>

    <label>
      Total asistentes
      <select name="guests">
        <option value="1" selected>1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
      </select>
    </label>

    <div class="teams">
      <button type="button" data-team="bulba">🌿 Bulbasaur</button>
      <button type="button" data-team="char">🔥 Charmander</button>
      <button type="button" data-team="squirt">💧 Squirtle</button>
    </div>

    <button type="submit">Enviar RSVP</button>
    <div id="formMsg"></div>
  </form>
</section>

<section id="lugar">
  <h2>Lugar</h2>
  <a href="https://maps.app.goo.gl/UPhoGzdxjPkSjg227" target="_blank">
    Ver en Google Maps
  </a>
</section>

<section>
  <h2>Compartir</h2>
  <div id="qr"></div>
</section>

</main>

<script src="/js/main.js" defer></script>
<script src="/js/ajax.js" defer></script>
</body>
</html>
